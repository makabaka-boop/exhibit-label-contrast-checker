services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      - web
    environment:
      # Playwright 指向 web 服务；wait-for-web 据此等待其就绪
      BASE_URL: http://web:80
      VERIFY_TARGET: http://web:80
      CI: "1"
